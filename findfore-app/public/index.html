<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>FindFore</title>
    <meta name="description" content="Find your next game of golf." />
    <!-- charcoal while the launch animation plays; the app switches it to light grey once it has dissolved in -->
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FindFore" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      /* charcoal during launch: newer iPhones colour the status bar from the page background.
         The app switches this to light grey once the splash has dissolved. */
      html,
      body {
        height: 100%;
        background-color: #0b0b0b;
        color-scheme: light;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      input,
      textarea {
        outline: none;
      }
      /* Boot splash: shows instantly while the app downloads, then the app takes over from the same frame */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0b;
      }
      #boot svg { width: 76px; height: 97.5px; overflow: visible; }
      #boot .stem { animation: boot-rise 1040ms cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-box: fill-box; transform-origin: 50% 100%; }
      #boot .tri {
        transform-box: fill-box;
        animation: boot-in 960ms 520ms cubic-bezier(0.3, 1.4, 0.5, 1) both, boot-nudge 2800ms 2200ms ease-in-out infinite;
      }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(14px) scaleY(0.85); } to { opacity: 1; transform: none; } }
      @keyframes boot-in { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
      @keyframes boot-nudge { 0%, 60%, 100% { transform: none; } 30% { transform: translateX(7px); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .stem, #boot .tri { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run FindFore.</noscript>
    <div id="root">
      <div id="boot" role="img" aria-label="FindFore is loading">
        <svg viewBox="0 0 230 295" aria-hidden="true">
          <path class="stem" fill="#C7FF00" d="M0 14Q0 0 14 0H230V100L58 57V295H0Z" />
          <path class="tri" fill="#C7FF00" d="M82 92L230 141L82 190Z" />
        </svg>
      </div>
    </div>
  </body>
</html>
