<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PlusFore</title>
    <meta name="description" content="Find your next game of golf." />
    <!-- forest green while the launch animation plays; the app switches it to light ivory once it has dissolved in -->
    <meta name="theme-color" content="#0F1A14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PlusFore" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style id="expo-reset">
      /* forest green during launch: newer iPhones colour the status bar from the page background.
         The app switches this to light ivory once the splash has dissolved. */
      html,
      body {
        height: 100%;
        background-color: #0f1a14;
        color-scheme: light;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      input,
      textarea {
        outline: none;
      }
      /* Boot splash: shows instantly while the app downloads, then the app takes over from the same frame */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 68px;
        background: #0f1a14;
      }
      #boot svg { width: 112px; height: 83.46px; margin-left: 11px; overflow: visible; }
      #boot .stem { animation: boot-rise 1040ms cubic-bezier(0.2, 0.8, 0.2, 1) both; transform-box: fill-box; transform-origin: 50% 100%; }
      #boot .tri {
        transform-box: fill-box;
        animation: boot-in 960ms 520ms cubic-bezier(0.3, 1.4, 0.5, 1) both, boot-nudge 2800ms 2200ms ease-in-out infinite;
      }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(14px) scaleY(0.85); } to { opacity: 1; transform: none; } }
      @keyframes boot-in { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
      @keyframes boot-nudge { 0%, 60%, 100% { transform: none; } 30% { transform: translateX(-6px); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .stem, #boot .tri { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PlusFore.</noscript>

      </div>

  </body>
</html>
